<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MacFlow AI chrome</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <h1>MacFlow AI chrome</h1>
    <p id="status" role="status" aria-live="polite">Đang đọc trạng thái…</p>
    <p>Nhập mã từ MacFlow rồi nhấn Kết nối. Không cần quay lại MacFlow xác nhận. Sau khi kết nối, extension tự nhận diện các tab AI.</p>
    <form id="pairForm">
      <label for="code">Mã ghép nối từ MacFlow</label><input id="code" type="password" minlength="45" maxlength="2048" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="connect" type="submit">Kết nối</button>
    </form>
    <p id="detected" role="status" aria-live="polite" hidden></p>
    <button id="open" type="button">Mở MacFlow</button>
    <p id="error" role="alert"></p>
    <script src="popup.js"></script>
  </body>
</html>
