name: ToonFlow independent integration validation
on:
  pull_request:
    branches:
      - main
      - feat/chromeBridgeMuseGeminiChatgpt
      - feat/remoteChromeBridgeRender
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrationCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun from npm registry
        run: |
          npm install --global bun@1.4.3
          bun --version
      - name: Install exact lockfile
        run: bun install --frozen-lockfile
      - name: Validate Chrome companion and Relay syntax
        run: |
          node --check packages/chromeCompanion/background.js
          node --check packages/chromeCompanion/remoteTransport.js
          node --check packages/chromeCompanion/content.js
          node --check apps/chromeRelay/server.js
          node -e "JSON.parse(require('node:fs').readFileSync('packages/chromeCompanion/manifest.json', 'utf8'))"
      - name: Typecheck changed workspaces individually
        run: |
          bun run --cwd apps/server typecheck
          bun run --cwd apps/web typecheck
          bun run --cwd packages/nodeShared typecheck
          bun run --cwd packages/nodeScaffold typecheck
          bun run --cwd packages/nodes/textNode typecheck
          bun run --cwd packages/nodes/imageGenerationNode typecheck
          bun run --cwd packages/nodes/videoGenerationNode typecheck
      - name: Build node and tool plugins
        run: |
          bun run build:tools
          bun run build:ext
          bun run build:nodes
      - name: Build Web and Server
        run: |
          bun run build
          bun run build:mcp
          bun run build:server
