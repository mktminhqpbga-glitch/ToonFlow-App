name: ToonFlow independent integration validation
on:
  pull_request:
    branches:
      - main
      - feat/chromeBridgeMuseGeminiChatgpt
      - feat/remoteChromeBridgeRender
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrationCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun from npm registry
        run: |
          npm install --global bun@1.4.3
          bun --version
      - name: Install exact lockfile
        run: bun install --frozen-lockfile
      - name: Validate Chrome companion and Relay syntax
        run: |
          node --check packages/chromeCompanion/background.js
          node --check packages/chromeCompanion/remoteTransport.js
          node --check packages/chromeCompanion/content.js
          node --check apps/chromeRelay/server.js
          node -e "JSON.parse(require('node:fs').readFileSync('packages/chromeCompanion/manifest.json', 'utf8'))"
      - name: Typecheck changed workspaces individually
        run: |
          bun run --cwd apps/server typecheck
          bun run --cwd apps/web typecheck
          bun run --cwd packages/nodeShared typecheck
          bun run --cwd packages/nodeScaffold typecheck
          bun run --cwd packages/nodes/textNode typecheck
          bun run --cwd packages/nodes/imageGenerationNode typecheck
          bun run --cwd packages/nodes/videoGenerationNode typecheck
          bun run --cwd packages/nodes/director3dNode typecheck
      - name: Install FFmpeg for real media fixture tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run HD-02/03/05 regression tests (FFmpeg fixtures, no AI providers)
        run: bun test apps/server/src/utils/media/batchTransitions.test.ts apps/server/src/utils/chromeBridge/dispatchGuard.test.ts apps/server/src/utils/chromeBridge/bridgeValidation.test.ts apps/server/src/utils/chromeBridge/mediaSignature.test.ts apps/server/src/utils/chromeBridge/access.test.ts apps/server/src/utils/media/batchFfmpeg.test.ts apps/web/tests/materialPresetCatalog.test.ts packages/nodeShared/tests/promptDrop.test.ts packages/i18n/src/vietnameseCoverage.test.ts apps/web/tests/characterRecords.test.ts apps/web/tests/languageDefaults.test.ts packages/i18n/src/hiddenPromptCoverage.test.ts packages/nodes/audioGenerationNode/tests/vietnameseUi.test.ts packages/nodes/frameAnalysisNode/tests/aiPromptVi.test.ts packages/nodes/imageNode/tests/hiddenPromptsVi.test.ts
      - name: Audit Vietnamese UI translation gaps (not an E2E assertion)
        run: bun packages/i18n/src/auditVietnamese.ts --strict
      - name: Build Tools
        run: bun run build:tools
      - name: Build Extensions
        run: bun run build:ext
      - name: Build Nodes
        run: bun run build:nodes
      - name: Build MCP
        run: bun run build:mcp
      - name: Build Web
        run: bun run --cwd apps/web build
      - name: Build Server
        run: bun run --cwd apps/server build
